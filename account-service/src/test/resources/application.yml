spring:
  config:
    import: "optional:configserver:"
  cloud:
    discovery:
      enabled: false
    config:
      enabled: false

eureka:
  client:
    enabled: false

jwt:
  private-key: classpath:certs/private.pem
  public-key: classpath:certs/public.pem
  expiration: 2h
  issuer: account-service