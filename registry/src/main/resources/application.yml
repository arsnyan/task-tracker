spring:
  application:
    name: registry

  config:
    import:
      configserver:

  cloud:
    config:
      uri: http://config-service:8888
      fail-fast: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    peer-node-read-timeout-ms: 100000