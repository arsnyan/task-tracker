eureka:
  client:
    enabled: false

spring:
  application:
    name: task-management-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost/.well-known/jwks.json
  config:
    import: "optional:configserver:"
  cloud:
    discovery:
      enabled: false
    config:
      enabled: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:"localhost:9092"}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.arsnyan.taskmanagementservice.model.message
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  kafka:
    topics:
      user_events: user_events
    consumer:
      concurrency: 3
      retry:
        max-attempts: 3
        backoff-ms: 1000

  task-reminder:
    max-tasks: 5

  email:
    motivational-quote: "Keep up with the good work!"
    cta-url: ""
    unsubscribe-url: ""
    preferences-url: ""
    daily-task-reminder-main-path: classpath:templates/daily-task-reminder-main.html
    daily-task-reminder-finished-path: classpath:templates/daily-task-reminder-finished.html
    daily-task-reminder-finished-row-path: classpath:templates/daily-task-reminder-finished-row.html
    daily-task-reminder-unfinished-path: classpath:templates/daily-task-reminder-unfinished.html
    daily-task-reminder-unfinished-row-path: classpath:templates/daily-task-reminder-unfinished-row.html

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html