<!-- Single Finished Task Row Template -->
<!-- Placeholders: %s for title, %s for formatted finishedAt -->

<tr>
    <td style="padding: 12px 20px; border-bottom: 1px solid #dcfce7;">
        <table width="100%%" cellpadding="0" cellspacing="0" border="0">
            <tr>
                <td style="width: 24px; vertical-align: top; padding-top: 2px;">
                    <div style="width: 20px; height: 20px; background-color: #059669; border-radius: 50%%; text-align: center; line-height: 20px;">
                        <span style="color: #ffffff; font-size: 12px;">✓</span>
                    </div>
                </td>
                <td style="padding-left: 12px;">
                    <p style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 500; color: #1f2937; line-height: 1.4;">
                        %s
                    </p>
                    <p style="margin: 4px 0 0 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; color: #6b7280;">
                        Completed %s
                    </p>
                </td>
            </tr>
        </table>
    </td>
</tr>
