<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Your Task Summary</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
</head>
<body style="margin: 0; padding: 0; background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">

<!-- Wrapper Table -->
<table width="100%%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f3f4f6;">
    <tr>
        <td align="center" style="padding: 40px 20px;">

            <!-- Main Content Container -->
            <table width="100%%" cellpadding="0" cellspacing="0" border="0" style="max-width: 560px; background-color: #ffffff; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);">

                <!-- Header -->
                <tr>
                    <td style="padding: 32px 32px 24px 32px; text-align: center; border-bottom: 1px solid #e5e7eb;">
                        <table width="100%%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td align="center">
                                    <!-- Logo/Brand -->
                                    <div style="width: 56px; height: 56px; background: linear-gradient(135deg, #3b82f6 0%%, #1d4ed8 100%%); border-radius: 14px; margin: 0 auto 16px auto; text-align: center; line-height: 56px;">
                                        <span style="font-size: 28px;">📋</span>
                                    </div>
                                    <h1 style="margin: 0 0 8px 0; font-family: 'Georgia', serif; font-size: 26px; font-weight: 700; color: #111827; letter-spacing: -0.5px;">
                                        Your Daily Task Summary
                                    </h1>
                                    <p style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; color: #6b7280; line-height: 1.5;">
                                        Here's what's happening with your tasks, %s
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Date Badge -->
                <tr>
                    <td style="padding: 20px 32px 8px 32px;">
                        <table cellpadding="0" cellspacing="0" border="0" align="center">
                            <tr>
                                <td style="background-color: #f3f4f6; padding: 8px 16px; border-radius: 20px;">
                                    <p style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; color: #4b5563;">
                                        📅 %s
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Task Sections Container -->
                <tr>
                    <td style="padding: 16px 32px 24px 32px;">

                        <!-- Finished Tasks Section -->
                        %s

                        <!-- Unfinished Tasks Section -->
                        %s

                    </td>
                </tr>

                <!-- Motivational Message -->
                <tr>
                    <td style="padding: 0 32px 24px 32px;">
                        <table width="100%%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="background: linear-gradient(135deg, #fef3c7 0%%, #fde68a 100%%); padding: 20px; border-radius: 12px; text-align: center;">
                                    <p style="margin: 0; font-family: 'Georgia', serif; font-size: 16px; font-style: italic; color: #92400e; line-height: 1.5;">
                                        "%s"
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- CTA Button -->
                <tr>
                    <td style="padding: 0 32px 32px 32px;" align="center">
                        <table cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="background: linear-gradient(135deg, #3b82f6 0%%, #1d4ed8 100%%); border-radius: 10px;">
                                    <a href="%s" style="display: inline-block; padding: 14px 32px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; color: #ffffff; text-decoration: none;">
                                        View All Tasks →
                                    </a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="padding: 24px 32px; background-color: #f9fafb; border-top: 1px solid #e5e7eb; border-radius: 0 0 16px 16px;">
                        <table width="100%%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td align="center">
                                    <p style="margin: 0 0 8px 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: #9ca3af;">
                                        You're receiving this because you enabled task summaries.
                                    </p>
                                    <p style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: #9ca3af;">
                                        <a href="%s" style="color: #6b7280; text-decoration: underline;">Unsubscribe</a> ·
                                        <a href="%s" style="color: #6b7280; text-decoration: underline;">Manage preferences</a>
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
