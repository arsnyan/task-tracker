<!-- Unfinished Tasks Partial Template -->
<!-- Placeholders: %s for count, %s for task rows -->

<table width="100%%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom: 8px;">
    <tr>
        <td style="padding: 16px 20px; background: linear-gradient(135deg, #dc2626 0%%, #b91c1c 100%%); border-radius: 12px 12px 0 0;">
            <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td style="padding-right: 10px; vertical-align: middle;">
                        <div style="width: 32px; height: 32px; background-color: rgba(255,255,255,0.2); border-radius: 8px; text-align: center; line-height: 32px;">
                            <span style="font-size: 18px;">⏳</span>
                        </div>
                    </td>
                    <td style="vertical-align: middle;">
                        <h2 style="margin: 0; font-family: 'Georgia', serif; font-size: 18px; font-weight: 600; color: #ffffff; letter-spacing: -0.3px;">
                            Pending Tasks
                        </h2>
                        <p style="margin: 2px 0 0 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: rgba(255,255,255,0.85);">
                            %s task(s) need attention
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td style="background-color: #fef2f2; border: 1px solid #fecaca; border-top: none; border-radius: 0 0 12px 12px; padding: 4px 0;">
            <table width="100%%" cellpadding="0" cellspacing="0" border="0">
                %s
            </table>
        </td>
    </tr>
</table>
